name: Tailscale Direct Windows RDP

on:
  workflow_dispatch:

jobs:
  build-rdp:
    runs-on: windows-latest
    steps:
      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Set RDP Password
        run: |
          net user runneradmin "RdpPassword123!"

      - name: Install Tailscale
        run: |
          winget install Tailscale.Tailscale

      - name: Connect Tailscale (Manual Login or Auth Key)
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --accept-routes

      - name: Show Tailscale IP
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4

      - name: Keep Alive Session
        run: |
          Write-Output "RDP is ready and running..."
          Start-Sleep -Seconds 21600
          
